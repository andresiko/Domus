# DOMUS — Entidades y automatizaciones Home Assistant v2.0
# packages/domus.yaml

mqtt:
  switch:
    - name: "Agua"
      unique_id: domus_relay_agua
      state_topic: "A6v3/30EDA03B1378/STATE"
      value_template: "{{ 'ON' if value_json.output1.value else 'OFF' }}"
      state_on: "ON"
      state_off: "OFF"
      command_topic: "A6v3/30EDA03B1378/SET"
      payload_on:  '{"output1":{"value":true}}'
      payload_off: '{"output1":{"value":false}}'
      icon: mdi:valve

    - name: "Sirena"
      unique_id: domus_relay_sirena
      state_topic: "A6v3/30EDA03B1378/STATE"
      value_template: "{{ 'ON' if value_json.output3.value else 'OFF' }}"
      state_on: "ON"
      state_off: "OFF"
      command_topic: "A6v3/30EDA03B1378/SET"
      payload_on:  '{"output3":{"value":true}}'
      payload_off: '{"output3":{"value":false}}'
      icon: mdi:alarm-bell

    - name: "Calefaccion Relay"
      unique_id: domus_relay_calef
      state_topic: "A6v3/30EDA03B1378/STATE"
      value_template: "{{ 'ON' if value_json.output2.value else 'OFF' }}"
      state_on: "ON"
      state_off: "OFF"
      command_topic: "A6v3/30EDA03B1378/SET"
      payload_on:  '{"output2":{"value":true}}'
      payload_off: '{"output2":{"value":false}}'
      icon: mdi:radiator

  binary_sensor:
    - name: "Inundacion"
      unique_id: domus_sensor_flood
      state_topic: "A6v3/30EDA03B1378/STATE"
      value_template: "{{ 'ON' if value_json.input1.value else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: moisture

    - name: "Movimiento"
      unique_id: domus_sensor_pir
      state_topic: "A6v3/30EDA03B1378/STATE"
      value_template: "{{ 'ON' if not value_json.input4.value else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: motion

    - name: "Humo Calor"
      unique_id: domus_sensor_smoke
      state_topic: "A6v3/30EDA03B1378/STATE"
      value_template: "{{ 'ON' if not value_json.input5.value else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: smoke

    - name: "Red Electrica"
      unique_id: domus_sensor_power
      state_topic: "A6v3/30EDA03B1378/STATE"
      value_template: "{{ 'ON' if value_json.input6.value else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: power

    - name: "Alarma Activa"
      unique_id: domus_alarm_active
      state_topic: "DOMUS/status"
      value_template: "{{ 'ON' if value_json.alarm != 'OFF' else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: safety

    - name: "Alarma Sonando"
      unique_id: domus_alarm_sounding
      state_topic: "DOMUS/status"
      value_template: "{{ 'ON' if value_json.alarm == 'SOUNDING' else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: sound

  sensor:
    - name: "Temperatura Interior"
      unique_id: domus_temp_int
      state_topic: "DOMUS/status"
      value_template: "{{ value_json.temp_int | default(none) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Humedad"
      unique_id: domus_humidity
      state_topic: "DOMUS/status"
      value_template: "{{ value_json.humidity | default(none) }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement

    - name: "Estado Alarma"
      unique_id: domus_alarm_state
      state_topic: "DOMUS/status"
      value_template: "{{ value_json.alarm }}"
      icon: mdi:shield-home

    - name: "Modo Calefaccion"
      unique_id: domus_heat_mode
      state_topic: "DOMUS/status"
      value_template: >
        {% set m = value_json.heat_mode | int %}
        {% if m == 0 %}OFF
        {% elif m == 1 %}Manual
        {% elif m == 2 %}Consigna
        {% else %}Programa{% endif %}
      icon: mdi:thermostat

# ── REGISTRO HISTORICO (recorder) ────────────────────────────────────────
# Antes: solo 10 dias y ~51 MB, con el 57% del volumen generado por ruido:
# la automatizacion del puente Xiaomi (49%) y los sensores de estadisticas
# de AdGuard (8%). Excluyendolos, 90 dias ocupan menos que antes 10 dias.
# Los sensores REALES de temperatura/humedad SI se siguen guardando.
recorder:
  purge_keep_days: 90
  exclude:
    entities:
      - automation.domus_publicar_ta_h_xiaomi_al_panel_mqtt
      - sun.sun
    entity_globs:
      - sensor.adguard_home_*

automation:

  # Limpieza del historial ya acumulado de las entidades recien excluidas.
  # Idempotente: al estar excluidas ya no generan datos nuevos, asi que en
  # arranques posteriores no encuentra nada que borrar.
  - id: domus_recorder_limpieza_ruido
    alias: "DOMUS - Limpiar historial de entidades excluidas"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: "00:02:00"
      - service: recorder.purge_entities
        target:
          entity_id:
            - automation.domus_publicar_ta_h_xiaomi_al_panel_mqtt
            - sun.sun
        data:
          keep_days: 0
          entity_globs:
            - sensor.adguard_home_*

  # ── FUENTE Tª/H INTERIOR (Xiaomi BLE local → panel por MQTT) ──────────────
  - id: domus_env_xiaomi_to_panel
    alias: "DOMUS - Publicar Tª/H Xiaomi al panel (MQTT)"
    mode: single
    max_exceeded: silent
    # El Xiaomi emite por BLE cada ~25 s. Disparar con CADA emision suponia
    # ~5.300 ejecuciones/dia (y otros tantos registros en la BD) para un dato
    # que en pantalla no necesita ese refresco. Basta cada 5 min + al arrancar.
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.temperature_humidity_sensor_a5ef_temperature'))
             and is_number(states('sensor.temperature_humidity_sensor_a5ef_humidity')) }}
    action:
      - service: mqtt.publish
        data:
          topic: "DOMUS/ENV"
          retain: true
          payload: >-
            {"t": {{ states('sensor.temperature_humidity_sensor_a5ef_temperature') }}, "h": {{ states('sensor.temperature_humidity_sensor_a5ef_humidity') }}}

  # ── NOTIFICACIONES ───────────────────────────────────────────────────────

  - id: domus_tg_flood_on
    alias: "DOMUS Telegram - Inundacion detectada"
    trigger:
      - platform: state
        entity_id: binary_sensor.inundacion
        to: "on"
        not_from: ["unavailable", "unknown"]
        for:
          seconds: 3
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "💧 *INUNDACIÓN DETECTADA*\nVálvula: {{ '🔓 Abierta' if is_state('switch.agua', 'on') else '🔒 Cerrada (auto)' }}"
          inline_keyboard:
            - - ["🔓 Abrir válvula", "/agua_abrir"]
              - ["🔒 Cerrar válvula", "/agua_cerrar"]

  - id: domus_tg_flood_repeat
    alias: "DOMUS Telegram - Inundacion repeticion 5min"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: binary_sensor.inundacion
        state: "on"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "💧 *INUNDACIÓN ACTIVA*\nVálvula: {{ '🔓 Abierta' if is_state('switch.agua', 'on') else '🔒 Cerrada' }}"
          inline_keyboard:
            - - ["🔓 Abrir válvula", "/agua_abrir"]
              - ["🔒 Cerrar válvula", "/agua_cerrar"]

  - id: domus_tg_flood_off
    alias: "DOMUS Telegram - Inundacion resuelta"
    trigger:
      - platform: state
        entity_id: binary_sensor.inundacion
        to: "off"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "✅ *Inundación resuelta*\nVálvula: {{ '🔓 Abierta' if is_state('switch.agua', 'on') else '🔒 Cerrada' }}"
          inline_keyboard:
            - - ["🔓 Abrir válvula", "/agua_abrir"]

  - id: domus_tg_smoke_on
    alias: "DOMUS Telegram - Alarma humo calor"
    trigger:
      - platform: state
        entity_id: binary_sensor.humo_calor
        to: "on"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔥 *ALARMA HUMO/CALOR*\nDetector cocina activo\nSirena: {{ '🔴 ON' if is_state('switch.sirena', 'on') else 'OFF' }}"
          inline_keyboard:
            - - ["🔕 Apagar sirena", "/sirena_off"]

  - id: domus_tg_smoke_repeat
    alias: "DOMUS Telegram - Humo calor repeticion 5min"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: binary_sensor.humo_calor
        state: "on"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔥 *HUMO/CALOR ACTIVO*\nSirena: {{ '🔴 ON' if is_state('switch.sirena', 'on') else 'OFF' }}"
          inline_keyboard:
            - - ["🔕 Apagar sirena", "/sirena_off"]

  - id: domus_tg_alarm_grace
    alias: "DOMUS Telegram - Alarma intrusion grace"
    trigger:
      - platform: state
        entity_id: sensor.estado_alarma
        to: "GRACE"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🚨 *POSIBLE INTRUSIÓN*\nMovimiento detectado\n30 segundos para cancelar"
          inline_keyboard:
            - - ["🔓 Desactivar alarma", "/desactivar"]

  - id: domus_tg_alarm_grace_repeat
    alias: "DOMUS Telegram - Intrusion repeticion 5min"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: sensor.estado_alarma
        state: "GRACE"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🚨 *ALARMA — PERIODO DE GRACIA*"
          inline_keyboard:
            - - ["🔓 Desactivar", "/desactivar"]

  - id: domus_tg_alarm_sounding
    alias: "DOMUS Telegram - Alarma sonando"
    trigger:
      - platform: state
        entity_id: sensor.estado_alarma
        to: "SOUNDING"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔴 *ALARMA SONANDO*\nSirena activa en casa"
          inline_keyboard:
            - - ["🔕 Apagar sirena", "/sirena_off"]
              - ["🔓 Desactivar", "/desactivar"]

  - id: domus_tg_alarm_sounding_repeat
    alias: "DOMUS Telegram - Alarma sonando repeticion 5min"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: sensor.estado_alarma
        state: "SOUNDING"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔴 *ALARMA SONANDO*"
          inline_keyboard:
            - - ["🔕 Apagar sirena", "/sirena_off"]
              - ["🔓 Desactivar", "/desactivar"]

  - id: domus_tg_power_off
    alias: "DOMUS Telegram - Corte de luz"
    trigger:
      - platform: state
        entity_id: binary_sensor.red_electrica
        to: "off"
        not_from: ["unavailable", "unknown"]
        for:
          seconds: 10
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "⚡ *CORTE DE LUZ*\nSin alimentación 220VAC"

  - id: domus_tg_power_on
    alias: "DOMUS Telegram - Luz restaurada"
    trigger:
      - platform: state
        entity_id: binary_sensor.red_electrica
        to: "on"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "✅ *Luz restaurada*\nAlimentación 220VAC OK"

  - id: domus_tg_alarm_armed
    alias: "DOMUS Telegram - Alarma armada"
    trigger:
      - platform: state
        entity_id: sensor.estado_alarma
        to: "ARMED"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🛡️ *Alarma armada*"

  - id: domus_tg_alarm_disarmed
    alias: "DOMUS Telegram - Alarma desarmada"
    trigger:
      - platform: state
        entity_id: sensor.estado_alarma
        to: "OFF"
        from: "ARMED"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔓 *Alarma desarmada*"

  # Ventana del ciclo de mantenimiento (temporizador de la KinCony):
  # lunes 04:00, cierra 1 minuto y reabre. Durante esa ventana NO se mandan
  # los avisos genericos de abierta/cerrada; se manda un unico mensaje claro
  # desde domus_tg_agua_mantenimiento.
  - id: domus_tg_agua_on
    alias: "DOMUS Telegram - Valvula agua abierta"
    trigger:
      - platform: state
        entity_id: switch.agua
        to: "on"
        not_from: ["unavailable", "unknown"]
    condition:
      - condition: not
        conditions:
          - condition: time
            after: "03:59:00"
            before: "04:05:00"
            weekday: [mon]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔓 Válvula agua *abierta*"
          inline_keyboard:
            - - ["🔒 Cerrar válvula", "/agua_cerrar"]

  - id: domus_tg_agua_off
    alias: "DOMUS Telegram - Valvula agua cerrada"
    trigger:
      - platform: state
        entity_id: switch.agua
        to: "off"
        not_from: ["unavailable", "unknown"]
    condition:
      - condition: not
        conditions:
          - condition: time
            after: "03:59:00"
            before: "04:05:00"
            weekday: [mon]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔒 Válvula agua *cerrada*"
          inline_keyboard:
            - - ["🔓 Abrir válvula", "/agua_abrir"]

  - id: domus_tg_agua_mantenimiento
    alias: "DOMUS Telegram - Ciclo mantenimiento valvula agua"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: switch.agua
        to: "off"
        not_from: ["unavailable", "unknown"]
    condition:
      - condition: time
        after: "03:59:00"
        before: "04:05:00"
        weekday: [mon]
    action:
      # Esperar a que el ciclo la reabra (normalmente 1 minuto)
      - wait_for_trigger:
          - platform: state
            entity_id: switch.agua
            to: "on"
        timeout: "00:05:00"
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.trigger is not none }}"
            sequence:
              - service: telegram_bot.send_message
                data:
                  chat_id: [133097449, 205920636]
                  parse_mode: markdown
                  message: "🔧 *Mantenimiento semanal*
Válvula de agua ciclada correctamente (cerrada y reabierta). Todo en orden."
        default:
          - service: telegram_bot.send_message
            data:
              chat_id: [133097449, 205920636]
              parse_mode: markdown
              message: "⚠️ *ATENCIÓN — Válvula de agua*
Se cerró en el ciclo de mantenimiento y *NO ha vuelto a abrirse* tras 5 minutos.
Revisa la instalación."
              inline_keyboard:
                - - ["🔓 Abrir válvula", "/agua_abrir"]

  - id: domus_tg_temp_low
    alias: "DOMUS Telegram - Temperatura baja"
    trigger:
      - platform: numeric_state
        entity_id: sensor.temperatura_interior
        below: 5
        for:
          minutes: 5
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🥶 *Temperatura baja*\nInterior: {{ states('sensor.temperatura_interior') }}°C"
          inline_keyboard:
            - - ["♨️ Encender calefacción", "/calef_on"]

  # ── COMANDOS ─────────────────────────────────────────────────────────────

  - id: domus_cmd_estado
    alias: "DOMUS Bot - /estado"
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/estado"
    condition:
      - condition: template
        value_template: "{{ trigger.event.data.chat_id | string in ['133097449', '205920636'] }}"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: |-
            🏠 *DOMUS — Estado*
            ━━━━━━━━━━━━━━━
            🛡️ *Alarma:* {% set s = states('sensor.estado_alarma') %}{% if s == 'OFF' %}Desarmada{% elif s == 'ARMING' %}Armando...{% elif s == 'ARMED' %}Armada ✅{% elif s == 'GRACE' %}⚠️ PERIODO DE GRACIA{% elif s == 'SOUNDING' %}🔴 SONANDO{% else %}{{ s }}{% endif %}
            ━━━━━━━━━━━━━━━
            💧 Inundación: {{ '🚨 ACTIVA' if is_state('binary_sensor.inundacion', 'on') else '✅ OK' }}
            🔥 Humo/calor: {{ '🚨 ACTIVA' if is_state('binary_sensor.humo_calor', 'on') else '✅ OK' }}
            ⚡ Red 220V: {{ '✅ OK' if is_state('binary_sensor.red_electrica', 'on') else '❌ CORTE' }}
            ━━━━━━━━━━━━━━━
            🚰 Válvula agua: {{ '🔓 Abierta' if is_state('switch.agua', 'on') else '🔒 Cerrada' }}
            ♨️ Calefacción: {{ '🔴 ON' if is_state('switch.calefaccion_relay', 'on') else 'OFF' }}
            🔊 Sirena: {{ '🔴 ON' if is_state('switch.sirena', 'on') else 'OFF' }}
            ━━━━━━━━━━━━━━━
            🌡️ Interior: *{{ states('sensor.temperatura_interior') }}°C*
            💧 Humedad: {{ states('sensor.humedad') }}%

  - id: domus_cmd_temp
    alias: "DOMUS Bot - /temp"
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/temp"
    condition:
      - condition: template
        value_template: "{{ trigger.event.data.chat_id | string in ['133097449', '205920636'] }}"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🌡️ Interior: *{{ states('sensor.temperatura_interior') }}°C*\n💧 Humedad: {{ states('sensor.humedad') }}%"

  - id: domus_cmd_agua
    alias: "DOMUS Bot - /agua"
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/agua"
    condition:
      - condition: template
        value_template: "{{ trigger.event.data.chat_id | string in ['133097449', '205920636'] }}"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.args[0] | default('') == 'on' }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.agua
              - service: telegram_bot.send_message
                data:
                  chat_id: [133097449, 205920636]
                  parse_mode: markdown
                  message: "🔓 Válvula agua *abierta*"
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.args[0] | default('') == 'off' }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.agua
              - service: telegram_bot.send_message
                data:
                  chat_id: [133097449, 205920636]
                  parse_mode: markdown
                  message: "🔒 Válvula agua *cerrada*"
        default:
          - service: telegram_bot.send_message
            data:
              chat_id: [133097449, 205920636]
              parse_mode: markdown
              message: "🚰 *Válvula agua*\nEstado: {{ '🔓 Abierta' if is_state('switch.agua', 'on') else '🔒 Cerrada' }}\n\nUso: /agua on o /agua off"
              inline_keyboard:
                - - ["🔓 Abrir", "/agua_abrir"]
                  - ["🔒 Cerrar", "/agua_cerrar"]

  - id: domus_cmd_calef
    alias: "DOMUS Bot - /calef"
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/calef"
    condition:
      - condition: template
        value_template: "{{ trigger.event.data.chat_id | string in ['133097449', '205920636'] }}"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.args[0] | default('') == 'on' }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.calefaccion_relay
              - service: telegram_bot.send_message
                data:
                  chat_id: [133097449, 205920636]
                  parse_mode: markdown
                  message: "♨️ Calefacción *encendida*"
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.args[0] | default('') == 'off' }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.calefaccion_relay
              - service: telegram_bot.send_message
                data:
                  chat_id: [133097449, 205920636]
                  parse_mode: markdown
                  message: "❄️ Calefacción *apagada*"
