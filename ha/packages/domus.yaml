# DOMUS — Entidades y automatizaciones Home Assistant v2.0
# packages/domus.yaml

# Los reles y entradas se leen de DOMUS/status (lo publica el panel cada 60 s y
# ante cada cambio), NO de A6v3/.../STATE. Motivo: el 07/09/2026 HA dejo de
# recibir A6v3/STATE y se quedo 8 h con la valvula marcada como cerrada estando
# abierta, sin forma de recuperarse. Con DOMUS/status, si se pierde un mensaje se
# resincroniza en <=60 s. Los command_topic siguen yendo directos a la KinCony.
mqtt:
  switch:
    - name: "Agua"
      unique_id: domus_relay_agua
      state_topic: "DOMUS/status"
      value_template: "{{ 'ON' if value_json.agua else 'OFF' }}"
      state_on: "ON"
      state_off: "OFF"
      command_topic: "A6v3/30EDA03B1378/SET"
      payload_on:  '{"output1":{"value":true}}'
      payload_off: '{"output1":{"value":false}}'
      icon: mdi:valve

    - name: "Sirena"
      unique_id: domus_relay_sirena
      state_topic: "DOMUS/status"
      value_template: "{{ 'ON' if value_json.sirena else 'OFF' }}"
      state_on: "ON"
      state_off: "OFF"
      command_topic: "A6v3/30EDA03B1378/SET"
      payload_on:  '{"output3":{"value":true}}'
      payload_off: '{"output3":{"value":false}}'
      icon: mdi:alarm-bell

    - name: "Calefaccion Relay"
      unique_id: domus_relay_calef
      state_topic: "DOMUS/status"
      value_template: "{{ 'ON' if value_json.heat_relay else 'OFF' }}"
      state_on: "ON"
      state_off: "OFF"
      command_topic: "A6v3/30EDA03B1378/SET"
      payload_on:  '{"output2":{"value":true}}'
      payload_off: '{"output2":{"value":false}}'
      icon: mdi:radiator

  binary_sensor:
    - name: "Inundacion"
      unique_id: domus_sensor_flood
      state_topic: "DOMUS/status"
      value_template: "{{ 'ON' if value_json.flood else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: moisture

    - name: "Movimiento"
      unique_id: domus_sensor_pir
      state_topic: "DOMUS/status"
      value_template: "{{ 'ON' if value_json.pir else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: motion

    - name: "Humo Calor"
      unique_id: domus_sensor_smoke
      state_topic: "DOMUS/status"
      value_template: "{{ 'ON' if value_json.smoke else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: smoke

    - name: "Red Electrica"
      unique_id: domus_sensor_power
      state_topic: "DOMUS/status"
      value_template: "{{ 'ON' if value_json.power else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: power

    - name: "Alarma Activa"
      unique_id: domus_alarm_active
      state_topic: "DOMUS/status"
      value_template: "{{ 'ON' if value_json.alarm != 'OFF' else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: safety

    - name: "Alarma Sonando"
      unique_id: domus_alarm_sounding
      state_topic: "DOMUS/status"
      value_template: "{{ 'ON' if value_json.alarm == 'SOUNDING' else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: sound

  sensor:
    - name: "Temperatura Interior"
      unique_id: domus_temp_int
      state_topic: "DOMUS/status"
      value_template: "{{ value_json.temp_int | default(none) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Humedad"
      unique_id: domus_humidity
      state_topic: "DOMUS/status"
      value_template: "{{ value_json.humidity | default(none) }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement

    - name: "Silencio Alarma"
      unique_id: domus_alarm_snooze
      state_topic: "DOMUS/status"
      value_template: "{{ value_json.snooze | default(0) }}"
      unit_of_measurement: "min"
      icon: mdi:bell-sleep

    - name: "Estado Alarma"
      unique_id: domus_alarm_state
      state_topic: "DOMUS/status"
      value_template: "{{ value_json.alarm }}"
      icon: mdi:shield-home

    - name: "Modo Calefaccion"
      unique_id: domus_heat_mode
      state_topic: "DOMUS/status"
      value_template: >
        {% set m = value_json.heat_mode | int %}
        {% if m == 0 %}OFF
        {% elif m == 1 %}Manual
        {% elif m == 2 %}Consigna
        {% else %}Programa{% endif %}
      icon: mdi:thermostat

# Marca de tiempo del ultimo ciclo corto de la valvula (cierre+reapertura
# en <=3 min). La escribe domus_tg_agua_ciclo_ok y la vigila
# domus_tg_agua_ciclo_ausente. Sobrevive a reinicios de HA.
input_datetime:
  domus_valvula_ciclo:
    name: "Ultimo ciclo valvula agua"
    has_date: true
    has_time: true
    icon: mdi:valve-open

# ── REGISTRO HISTORICO (recorder) ────────────────────────────────────────
# Antes: solo 10 dias y ~51 MB, con el 57% del volumen generado por ruido:
# la automatizacion del puente Xiaomi (49%) y los sensores de estadisticas
# de AdGuard (8%). Excluyendolos, 90 dias ocupan menos que antes 10 dias.
# Los sensores REALES de temperatura/humedad SI se siguen guardando.
recorder:
  purge_keep_days: 90
  exclude:
    entities:
      - automation.domus_publicar_ta_h_xiaomi_al_panel_mqtt
      - sun.sun
    entity_globs:
      - sensor.adguard_home_*

automation:

  # Limpieza del historial ya acumulado de las entidades recien excluidas.
  # Idempotente: al estar excluidas ya no generan datos nuevos, asi que en
  # arranques posteriores no encuentra nada que borrar.
  - id: domus_recorder_limpieza_ruido
    alias: "DOMUS - Limpiar historial de entidades excluidas"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: "00:02:00"
      - service: recorder.purge_entities
        target:
          entity_id:
            - automation.domus_publicar_ta_h_xiaomi_al_panel_mqtt
            - sun.sun
        data:
          keep_days: 0
          entity_globs:
            - sensor.adguard_home_*

  # ── FUENTE Tª/H INTERIOR (Xiaomi BLE local → panel por MQTT) ──────────────
  - id: domus_env_xiaomi_to_panel
    alias: "DOMUS - Publicar Tª/H Xiaomi al panel (MQTT)"
    mode: single
    max_exceeded: silent
    # El Xiaomi emite por BLE cada ~25 s. Disparar con CADA emision suponia
    # ~5.300 ejecuciones/dia (y otros tantos registros en la BD) para un dato
    # que en pantalla no necesita ese refresco. Basta cada 5 min + al arrancar.
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.temperature_humidity_sensor_a5ef_temperature'))
             and is_number(states('sensor.temperature_humidity_sensor_a5ef_humidity')) }}
    action:
      - service: mqtt.publish
        data:
          topic: "DOMUS/ENV"
          retain: true
          payload: >-
            {"t": {{ states('sensor.temperature_humidity_sensor_a5ef_temperature') }}, "h": {{ states('sensor.temperature_humidity_sensor_a5ef_humidity') }}}

  # ── NOTIFICACIONES ───────────────────────────────────────────────────────

  - id: domus_tg_flood_on
    alias: "DOMUS Telegram - Inundacion detectada"
    trigger:
      - platform: state
        entity_id: binary_sensor.inundacion
        to: "on"
        not_from: ["unavailable", "unknown"]
        for:
          seconds: 3
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "💧 *INUNDACIÓN DETECTADA*\nVálvula: {{ '🔓 Abierta' if is_state('switch.agua', 'on') else '🔒 Cerrada (auto)' }}"
          inline_keyboard:
            - - ["🔓 Abrir válvula", "/agua_abrir"]
              - ["🔒 Cerrar válvula", "/agua_cerrar"]
            - - ["🔕 Apagar sirena", "/sirena_off"]

  - id: domus_tg_flood_repeat
    alias: "DOMUS Telegram - Inundacion repeticion 5min"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: binary_sensor.inundacion
        state: "on"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "💧 *INUNDACIÓN ACTIVA*\nVálvula: {{ '🔓 Abierta' if is_state('switch.agua', 'on') else '🔒 Cerrada' }}"
          inline_keyboard:
            - - ["🔓 Abrir válvula", "/agua_abrir"]
              - ["🔒 Cerrar válvula", "/agua_cerrar"]

  - id: domus_tg_flood_off
    alias: "DOMUS Telegram - Inundacion resuelta"
    trigger:
      - platform: state
        entity_id: binary_sensor.inundacion
        to: "off"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "✅ *Inundación resuelta*\nVálvula: {{ '🔓 Abierta' if is_state('switch.agua', 'on') else '🔒 Cerrada' }}"
          inline_keyboard:
            - - ["🔓 Abrir válvula", "/agua_abrir"]

  - id: domus_tg_smoke_on
    alias: "DOMUS Telegram - Alarma humo calor"
    trigger:
      - platform: state
        entity_id: binary_sensor.humo_calor
        to: "on"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: >-
            🔥 *ALARMA HUMO/CALOR*

            Detector cocina activo

            Sirena: {{ '🔴 ON' if is_state('switch.sirena', 'on') else 'OFF' }}
            {%- set sn = states('sensor.silencio_alarma') | int(0) %}
            {{ '🔕 Silenciada ' ~ sn ~ ' min mas' if sn > 0 else '' }}
          inline_keyboard:
            - - ["🔕 Apagar sirena", "/sirena_off"]

  - id: domus_tg_smoke_repeat
    alias: "DOMUS Telegram - Humo calor repeticion 5min"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: binary_sensor.humo_calor
        state: "on"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔥 *HUMO/CALOR ACTIVO*\nSirena: {{ '🔴 ON' if is_state('switch.sirena', 'on') else 'OFF' }}"
          inline_keyboard:
            - - ["🔕 Apagar sirena", "/sirena_off"]

  - id: domus_tg_alarm_grace
    alias: "DOMUS Telegram - Alarma intrusion grace"
    trigger:
      - platform: state
        entity_id: sensor.estado_alarma
        to: "GRACE"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🚨 *POSIBLE INTRUSIÓN*\nMovimiento detectado\n30 segundos para cancelar"
          inline_keyboard:
            - - ["🔓 Desactivar alarma", "/desactivar"]

  - id: domus_tg_alarm_grace_repeat
    alias: "DOMUS Telegram - Intrusion repeticion 5min"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: sensor.estado_alarma
        state: "GRACE"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🚨 *ALARMA — PERIODO DE GRACIA*"
          inline_keyboard:
            - - ["🔓 Desactivar", "/desactivar"]

  - id: domus_tg_alarm_sounding
    alias: "DOMUS Telegram - Alarma sonando"
    trigger:
      - platform: state
        entity_id: sensor.estado_alarma
        to: "SOUNDING"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔴 *ALARMA SONANDO*\nSirena activa en casa"
          inline_keyboard:
            - - ["🔕 Apagar sirena", "/sirena_off"]
              - ["🔓 Desactivar", "/desactivar"]

  - id: domus_tg_alarm_sounding_repeat
    alias: "DOMUS Telegram - Alarma sonando repeticion 5min"
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: sensor.estado_alarma
        state: "SOUNDING"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔴 *ALARMA SONANDO*"
          inline_keyboard:
            - - ["🔕 Apagar sirena", "/sirena_off"]
              - ["🔓 Desactivar", "/desactivar"]

  - id: domus_tg_power_off
    alias: "DOMUS Telegram - Corte de luz"
    trigger:
      - platform: state
        entity_id: binary_sensor.red_electrica
        to: "off"
        not_from: ["unavailable", "unknown"]
        for:
          seconds: 10
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "⚡ *CORTE DE LUZ*\nSin alimentación 220VAC"

  - id: domus_tg_power_on
    alias: "DOMUS Telegram - Luz restaurada"
    trigger:
      - platform: state
        entity_id: binary_sensor.red_electrica
        to: "on"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "✅ *Luz restaurada*\nAlimentación 220VAC OK"

  - id: domus_tg_alarm_armed
    alias: "DOMUS Telegram - Alarma armada"
    trigger:
      - platform: state
        entity_id: sensor.estado_alarma
        to: "ARMED"
        not_from: ["unavailable", "unknown"]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🛡️ *Alarma armada*"

  - id: domus_tg_alarm_disarmed
    alias: "DOMUS Telegram - Alarma desarmada"
    trigger:
      - platform: state
        entity_id: sensor.estado_alarma
        to: "OFF"
        from: "ARMED"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔓 *Alarma desarmada*"

  # ---------------------------------------------------------------------------
  # VALVULA DE AGUA — avisos robustos frente al cambio de hora
  #
  # El ciclo de mantenimiento vive en el temporizador de la KinCony: lunes de
  # madrugada cierra la valvula 1 minuto y la reabre.
  #
  # OJO: la KinCony NO aplica horario de verano. Su reloj lleva un desfase fijo,
  # asi que el ciclo cae a las 04:00 en horario de verano y a las 03:00 en
  # horario de invierno. Comprobado en el registro del panel:
  #     19/10/2026 04:00:01 OFF -> 04:01:01 ON   (horario de verano)
  #     26/10/2026 03:00:00 OFF -> 03:01:00 ON   (horario de invierno)
  # El 26/10 el aviso de mantenimiento no salio y en su lugar llegaron los dos
  # avisos genericos, porque la ventana estaba fijada en 03:59-04:05.
  #
  # Diseno a prueba de relojes:
  #  - Los avisos genericos de abierta/cerrada NO dependen de la hora: exigen
  #    que el cambio DURE mas de 3 minutos. Un ciclo de 1 minuto no los dispara
  #    nunca, a cualquier hora que caiga.
  #  - El ciclo corto (cierre + reapertura en <= 3 min) se detecta por su forma,
  #    no por el reloj, y se registra en input_datetime.domus_valvula_ciclo.
  #  - La ventana del lunes (02:00-06:00) solo decide si ese ciclo corto merece
  #    el mensaje de "mantenimiento semanal" o es un toqueteo manual.
  #  - Si algun lunes el ciclo no ocurre, salta un aviso a las 07:00.
  # ---------------------------------------------------------------------------

  - id: domus_tg_agua_off
    alias: "DOMUS Telegram - Valvula agua cerrada"
    trigger:
      - platform: state
        entity_id: switch.agua
        to: "off"
        not_from: ["unavailable", "unknown"]
        for: "00:03:00"          # un ciclo de mantenimiento (1 min) no llega aqui
    condition:
      # Durante la madrugada del lunes callamos: de un cierre que no reabre ya
      # avisa domus_tg_agua_ciclo_fallo con un mensaje mucho mas claro.
      - condition: not
        conditions:
          - condition: time
            after: "02:00:00"
            before: "06:00:00"
            weekday: [mon]
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔒 Válvula agua *cerrada*"
          inline_keyboard:
            - - ["🔓 Abrir válvula", "/agua_abrir"]

  - id: domus_tg_agua_on
    alias: "DOMUS Telegram - Valvula agua abierta"
    trigger:
      - platform: state
        entity_id: switch.agua
        to: "on"
        not_from: ["unavailable", "unknown"]
    condition:
      # Solo si estuvo cerrada de verdad (mas de 3 min). Asi la reapertura del
      # ciclo de mantenimiento no genera ruido, sea a las 03:00 o a las 04:00.
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and (as_timestamp(trigger.to_state.last_changed)
                  - as_timestamp(trigger.from_state.last_changed)) > 180 }}
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔓 Válvula agua *abierta*"
          inline_keyboard:
            - - ["🔒 Cerrar válvula", "/agua_cerrar"]

  # Ciclo corto detectado por su forma (cierre y reapertura en <= 3 min).
  # Siempre deja constancia de la fecha/hora; solo avisa por Telegram si cae en
  # la madrugada del lunes, que es cuando se espera el mantenimiento.
  - id: domus_tg_agua_ciclo_ok
    alias: "DOMUS Telegram - Ciclo mantenimiento valvula OK"
    trigger:
      - platform: state
        entity_id: switch.agua
        to: "on"
        not_from: ["unavailable", "unknown"]
    condition:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and (as_timestamp(trigger.to_state.last_changed)
                  - as_timestamp(trigger.from_state.last_changed)) <= 180 }}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.domus_valvula_ciclo
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - condition: time
        after: "02:00:00"
        before: "06:00:00"
        weekday: [mon]
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: >-
            🔧 *Mantenimiento semanal* — válvula de agua ciclada correctamente:
            cerrada a las {{ as_timestamp(trigger.from_state.last_changed) | timestamp_custom('%H:%M:%S') }}
            y reabierta a las {{ as_timestamp(trigger.to_state.last_changed) | timestamp_custom('%H:%M:%S') }}.
            Todo en orden.

  # El ciclo cerro la valvula pero no la ha reabierto.
  - id: domus_tg_agua_ciclo_fallo
    alias: "DOMUS Telegram - Ciclo mantenimiento valvula NO reabre"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: switch.agua
        to: "off"
        not_from: ["unavailable", "unknown"]
    condition:
      - condition: time
        after: "02:00:00"
        before: "06:00:00"
        weekday: [mon]
      # Si es una inundacion, el aviso correcto es el de inundacion, no este.
      - condition: state
        entity_id: binary_sensor.inundacion
        state: "off"
    action:
      # wait_template (no wait_for_trigger): comprueba el ESTADO, asi que vale
      # tanto si el cambio llega despues como si ya estaba abierta al evaluar.
      - wait_template: "{{ is_state('switch.agua', 'on') }}"
        timeout: "00:10:00"
        continue_on_timeout: true
      - condition: template
        value_template: "{{ not wait.completed }}"
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: |-
            ⚠️ *ATENCIÓN — Válvula de agua*
            Se cerró en el ciclo de mantenimiento y *NO ha vuelto a abrirse* tras 10 minutos. Revisa la instalación.
          inline_keyboard:
            - - ["🔓 Abrir válvula", "/agua_abrir"]

  # Red de seguridad: el lunes a las 07:00, si esta noche no se ha registrado
  # ningun ciclo, es que el temporizador de la KinCony no ha actuado.
  - id: domus_tg_agua_ciclo_ausente
    alias: "DOMUS Telegram - Ciclo mantenimiento valvula ausente"
    trigger:
      - platform: time
        at: "07:00:00"
    condition:
      - condition: time
        weekday: [mon]
      - condition: template
        value_template: >-
          {{ states('input_datetime.domus_valvula_ciclo')[:10] != now().strftime('%Y-%m-%d') }}
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: >-
            ⚠️ *Válvula de agua* — esta noche *no* se ha ejecutado el ciclo semanal
            de mantenimiento. Último ciclo registrado:
            {{ states('input_datetime.domus_valvula_ciclo') }}.
            Revisa el temporizador de la KinCony.

  - id: domus_tg_temp_low
    alias: "DOMUS Telegram - Temperatura baja"
    trigger:
      - platform: numeric_state
        entity_id: sensor.temperatura_interior
        below: 5
        for:
          minutes: 5
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🥶 *Temperatura baja*\nInterior: {{ states('sensor.temperatura_interior') }}°C"
          inline_keyboard:
            - - ["♨️ Encender calefacción", "/calef_on"]

  # ── COMANDOS ─────────────────────────────────────────────────────────────

  - id: domus_cmd_estado
    alias: "DOMUS Bot - /estado"
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/estado"
    condition:
      - condition: template
        value_template: "{{ trigger.event.data.chat_id | string in ['133097449', '205920636'] }}"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: |-
            🏠 *DOMUS — Estado*
            ━━━━━━━━━━━━━━━
            🛡️ *Alarma:* {% set s = states('sensor.estado_alarma') %}{% if s == 'OFF' %}Desarmada{% elif s == 'ARMING' %}Armando...{% elif s == 'ARMED' %}Armada ✅{% elif s == 'GRACE' %}⚠️ PERIODO DE GRACIA{% elif s == 'SOUNDING' %}🔴 SONANDO{% else %}{{ s }}{% endif %}
            ━━━━━━━━━━━━━━━
            💧 Inundación: {{ '🚨 ACTIVA' if is_state('binary_sensor.inundacion', 'on') else '✅ OK' }}
            🔥 Humo/calor: {{ '🚨 ACTIVA' if is_state('binary_sensor.humo_calor', 'on') else '✅ OK' }}
            ⚡ Red 220V: {{ '✅ OK' if is_state('binary_sensor.red_electrica', 'on') else '❌ CORTE' }}
            ━━━━━━━━━━━━━━━
            🚰 Válvula agua: {{ '🔓 Abierta' if is_state('switch.agua', 'on') else '🔒 Cerrada' }}
            ♨️ Calefacción: {{ '🔴 ON' if is_state('switch.calefaccion_relay', 'on') else 'OFF' }}
            🔊 Sirena: {{ '🔴 ON' if is_state('switch.sirena', 'on') else 'OFF' }}
            ━━━━━━━━━━━━━━━
            🌡️ Interior: *{{ states('sensor.temperatura_interior') }}°C*
            💧 Humedad: {{ states('sensor.humedad') }}%

  - id: domus_cmd_temp
    alias: "DOMUS Bot - /temp"
    trigger:
      - platform: event
        event_type: telegram_command
        event_data:
          command: "/temp"
    condition:
      - condition: template
        value_template: "{{ trigger.event.data.chat_id | string in ['133097449', '205920636'] }}"
    action:
      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🌡️ Interior: *{{ states('sensor.temperatura_interior') }}°C*\n💧 Humedad: {{ states('sensor.humedad') }}%"

  - id: domus_cmd_agua
    alias: "DOMUS Bot - /agua"
