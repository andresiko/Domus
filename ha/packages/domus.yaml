    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.args | length == 0 }}"
            sequence:
              - service: telegram_bot.send_message
                data:
                  chat_id: [133097449, 205920636]
                  parse_mode: markdown
                  message: "🛡️ Indica el PIN: `/armar XXXX`"
        default:
          - service: mqtt.publish
            data:
              topic: "DOMUS/CMD"
              payload: '{"cmd":"arm","pin":"{{ trigger.event.data.args[0] }}"}'
          - service: telegram_bot.send_message
            data:
              chat_id: [133097449, 205920636]
              parse_mode: markdown
              message: "⏳ *Activando alarma...*\nSi el PIN es correcto recibirás confirmación."

  - id: domus_cmd_desactivar
    alias: "DOMUS Bot - /desactivar"
    trigger:
