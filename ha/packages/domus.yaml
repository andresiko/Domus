              chat_id: [133097449, 205920636]
              parse_mode: markdown
              message: "♨️ *Calefacción*\nEstado: {{ '🔴 ON' if is_state('switch.calefaccion_relay', 'on') else 'OFF' }}\n\nUso: /calef on o /calef off"
