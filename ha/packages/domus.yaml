      - service: telegram_bot.send_message
        data:
          chat_id: [133097449, 205920636]
          parse_mode: markdown
          message: "🔓 *Alarma desactivada*"

  # ── CALLBACKS (botones inline) ────────────────────────────────────────────

  - id: domus_cb_sirena_on
    alias: "DOMUS Bot - Boton encender sirena"
    trigger:
      - platform: event
        event_type: telegram_callback
        event_data:
          data: "/sirena_on"
    condition:
      - condition: template
        value_template: "{{ trigger.event.data.chat_id | string in ['133097449', '205920636'] }}"
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.sirena
      - service: telegram_bot.answer_callback_query
        data:
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "Sirena encendida"

  - id: domus_cb_sirena_off
    alias: "DOMUS Bot - Boton apagar sirena"
    trigger:
      - platform: event
        event_type: telegram_callback
        event_data:
          data: "/sirena_off"
    condition:
      - condition: template
        value_template: "{{ trigger.event.data.chat_id | string in ['133097449', '205920636'] }}"
    action:
      # cmd silence: el panel apaga la sirena y abre 15 min de silencio. Con
      # switch.turn_off se apagaba el rele pero la alarma volvia a saltar enseguida.
      - service: mqtt.publish
        data:
          topic: "DOMUS/CMD"
          payload: '{"cmd":"silence"}'
      - service: telegram_bot.answer_callback_query
        data:
          callback_query_id: "{{ trigger.event.data.id }}"
          message: "Sirena apagada - 15 min de silencio"

