          command: "/agua"
    condition:
      - condition: template
        value_template: "{{ trigger.event.data.chat_id | string in ['133097449', '205920636'] }}"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.args[0] | default('') == 'on' }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.agua
              - service: telegram_bot.send_message
                data:
                  chat_id: [133097449, 205920636]
                  parse_mode: markdown
                  message: "🔓 Válvula agua *abierta*"
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.args[0] | default('') == 'off' }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.agua
              - service: telegram_bot.send_message
                data:
                  chat_id: [133097449, 205920636]
                  parse_mode: markdown
                  message: "🔒 Válvula agua *cerrada*"
        default:
          - service: telegram_bot.send_message
            data:
              chat_id: [133097449, 205920636]
              parse_mode: markdown
              message: "🚰 *Válvula agua*\nEstado: {{ '🔓 Abierta' if is_state('switch.agua', 'on') else '🔒 Cerrada' }}\n\nUso: /agua on o /agua off"
              inline_keyboard:
                - - ["🔓 Abrir", "/agua_abrir"]
                  - ["🔒 Cerrar", "/agua_cerrar"]

