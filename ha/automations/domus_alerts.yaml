# DOMUS — Automatizaciones de alertas push (app movil)
#
# OJO: aqui NO se manda nada por Telegram. Los avisos de Telegram viven
# todos en packages/domus.yaml (automatizaciones domus_tg_*). Antes este
# fichero mandaba movil + Telegram y el package mandaba Telegram otra vez,
# asi que por cada evento llegaban DOS mensajes de Telegram identicos.
# Un canal por fichero: movil aqui, Telegram en el package.

- id: domus_alert_flood
  alias: "DOMUS — Alerta inundación"
  trigger:
    - platform: state
      entity_id: binary_sensor.inundacion
      to: "on"
      not_from: ["unavailable", "unknown"]
  condition:
    - condition: state
      entity_id: binary_sensor.inundacion
      state: "on"
  action:
    - service: notify.mobile_app_oneplus
      data:
        title: "🚨 INUNDACIÓN DETECTADA"
        message: "Sensor de inundación activo. Válvulas cerradas automáticamente."
        data:
          tag: domus_flood
          importance: high

- id: domus_alert_flood_repeat
  alias: "DOMUS — Alerta inundación repetición"
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: state
      entity_id: binary_sensor.inundacion
      state: "on"
  action:
    - service: notify.mobile_app_oneplus
      data:
        title: "🚨 INUNDACIÓN DETECTADA"
        message: "Sensor de inundación activo. Válvulas cerradas automáticamente."
        data:
          tag: domus_flood
          importance: high

