- id: domus_alert_power_cut
  alias: "DOMUS — Corte de luz"
  trigger:
    - platform: state
      entity_id: binary_sensor.red_electrica
      to: "off"
      not_from: ["unavailable", "unknown"]
      for:
        seconds: 10
  action:
    - service: notify.mobile_app_oneplus
      data:
        title: "⚡ CORTE DE LUZ"
        message: "Sin alimentación 220VAC detectada en casa."
        data:
          tag: domus_power

- id: domus_alert_power_cut_repeat
  alias: "DOMUS — Corte de luz repetición"
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: state
      entity_id: binary_sensor.red_electrica
      state: "off"
  action:
    - service: notify.mobile_app_oneplus
      data:
        title: "⚡ CORTE DE LUZ"
        message: "Sin alimentación 220VAC detectada en casa."
        data:
          tag: domus_power

- id: domus_alert_power_restore
  alias: "DOMUS — Luz restaurada"
  trigger:
